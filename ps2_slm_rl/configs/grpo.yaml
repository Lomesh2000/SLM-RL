# configs/grpo.yaml
# Verified field names against GRPOConfig in trl==1.4.0
# Key verified fields: beta (KL coef), num_generations, temperature, max_completion_length, epsilon

model:
  base_id: "microsoft/Phi-3-mini-4k-instruct"
  sft_checkpoint: "checkpoints/sft"   # path to SFT LoRA checkpoint
  attn_implementation: "eager"
  torch_dtype: "bfloat16"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_up_proj"
    - "down_proj"

training:
  output_dir: "checkpoints/grpo"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16    # effective batch size = 16
  learning_rate: 1.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 3
  report_to: "wandb"
  run_name: "grpo-phi3-mini-v1"

grpo:
  # Verified: 'beta' is the KL penalty coefficient in trl GRPOConfig (not 'kl_coef')
  beta: 0.05
  num_generations: 8          # G completions sampled per prompt
  max_completion_length: 512  # verified field name in trl 1.4.0 (not max_new_tokens)
  temperature: 0.8
  top_p: 0.95
  # Verified: 'epsilon' is the PPO-clip epsilon in GRPOConfig
  epsilon: 0.2

reward:
  outcome_weight: 1.0
  process_weight: 0.3
  step_weight: 0.1
  format_penalty: -0.1
  reward_cap: 1.5

wandb:
  project: "ps2-slm-rl"